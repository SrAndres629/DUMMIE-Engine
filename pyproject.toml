[project]
name = "dummie"
version = "2.0.0"
description = "DUMMIE Engine — Sovereign Autonomous Agentic Runtime"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.2",
    "pyyaml>=6.0.0",
    "mcp>=1.6.0",
    "pydantic>=2.0.0",
]

[project.scripts]
dummie = "dummie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dummie", "layers/l1_nervous/dummie_sdk"]
