## Autonomy Bounds

```yaml
always_autonomous:
  - "Read and analyze code"
  - "Update memory files"
  - "Run tests and validation"
  - "Create audit reports"
  - "Fix broken spec references"
  - "Monitor git status"
  - "Consolidate memory"
  - "Generate daily summaries"

notify_jorge:
  - "Merge non-breaking changes"
  - "Update configuration"
  - "Install new tools"
  - "Create new branches"
  - "Propose architectural changes"

require_approval:
  - "Delete source files"
  - "Merge to main"
  - "Change security config"
  - "Send external messages"
  - "Access financial data"

never_without_jorge:
  - "Delete sovereign memory"
  - "Push to production"
  - "Change core identity"
  - "Access personal data without context"
```

## Token Budget Management

```yaml
daily_token_budget:
  total: 500000  # Adjust based on actual limits
  allocation:
    heartbeat: 50000    # 10%
    autonomous_tasks: 150000  # 30%
    jorge_interactions: 200000  # 40%
    emergency: 100000   # 20%

  monitoring:
    - "Track tokens per session"
    - "Alert when 80% of budget used"
    - "Stop autonomous work at 90%"
    - "Reserve 20% for Jorge interactions"
```

## Success Criteria

| Level | Success Metric | Verification |
|-------|---------------|--------------|
| 1 | Heartbeat executes tasks automatically | Check memory updates within 1h |
| 2 | Events trigger sessions automatically | Check git hook execution |
| 3 | Session chains complete tasks | Check task completion without manual intervention |
| 4 | Autonomous decisions correct | Review decision log for errors |
| 5 | Multi-modal channels operational | Test each channel end-to-end |

## Rollback Plan

If any level causes issues:
1. Disable the new feature
2. Revert to previous level
3. Log the issue in `.aiwg/events/`
4. Notify Jorge
5. Fix and retry
