## Sovereign Responsibility

```yaml
layer: L2_BRAIN
sovereign_responsibility: "Cognitive organ — thinking, remembering, reasoning, deciding, evolving"
not_responsible_for:
  - "Transport/nervous system (L1)"
  - "Security/shield (L3)"
  - "Edge execution/scanning (L4)"
  - "Observability/visualization (L5)"
  - "Human interface (L6)"
```

