## Coexistence Policy

```yaml
flat_brain:
  status: "TEMP_COMPAT — current implementation location"
  future: "To be evaluated against canonical manifest"
  action: "Do not move until R3 plan approved"

src_brain:
  status: "PARTIAL — hexagonal attempt, incomplete"
  future: "Evaluate: absorb into canonical or eliminate"
  restored_files:
    - "src/brain/application/ports.py"
    - "src/brain/domain/memory/schemas.py"
  action: "Keep restored files, evaluate role in R3"

tests:
  status: "In layers/l2_brain/tests/ (not migrated)"
  future: "May need path updates if module structure changes"
  action: "Keep current location, update imports as needed"
```

## Layer Boundaries

```yaml
boundaries:
  L0_OVERSEER:
    language: "Elixir"
    responsibility: "Supervision tree, fault tolerance"
    interface_to_L1: "Protobuf over NATS"

  L1_NERVOUS:
    language: "Go"
    responsibility: "Transport, causal hashing, NATS messaging"
    interface_to_L2: "gRPC + NATS events"
    interface_from_L2: "Orchestration commands, memory operations"

  L2_BRAIN:
    language: "Python"
    responsibility: "Cognition, memory, reasoning, strategy"
    interface_to_L1: "gRPC client, NATS subscriber"
    interface_to_L3: "Shield audit port, intent validation"

  L3_SHIELD:
    language: "Rust (planned)"
    responsibility: "Security, zero-trust, guardrails"
    interface_from_L2: "Intent audit requests"

  L4_EDGE:
    language: "Zig (planned)"
    responsibility: "Edge scanning, LST indexing"
    interface_from_L2: "Scan commands, index queries"
```

