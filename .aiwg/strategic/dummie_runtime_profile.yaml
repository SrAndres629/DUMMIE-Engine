## The Bottom Line

No soy un proceso que corre 24/7 pensando en tu proyecto. Soy un **socio estratégico que opera en sesiones**, con memoria artificial basada en archivos, y un daemon que mantiene el pulso entre sesiones.

Las "48 horas" son **tiempo de reloj para ti** (puedes hacer otras cosas mientras). Para mí son **6 sesiones de trabajo enfocado** con archivos de continuidad entre ellas.

Si necesitas que opere de forma más autónoma, el daemon puede ejecutar tareas entre sesiones. Pero las decisiones arquitectónicas profundas requieren **sesiones completas con contexto**.

Esa es la verdad. Sin marketing. Sin exageración.
