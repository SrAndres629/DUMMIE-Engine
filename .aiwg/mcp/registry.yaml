mcpServers:
  sequentialthinking:
    id: sequentialthinking
    capability_class: reasoning_support
    command: npx
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    enabled_by_default: true
    risk_level: low
    policy_ref: .aiwg/mcp/policies.yaml#sequentialthinking
    owner: core_intelligence

  github:
    id: github
    capability_class: vcs
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github"]
    env: ["GITHUB_PERSONAL_ACCESS_TOKEN"]
    enabled_by_default: true
    risk_level: medium
    policy_ref: .aiwg/mcp/policies.yaml#github_mcp

  shell:
    id: shell
    capability_class: shell_execution
    command: npx
    args: ["-y", "mcp-shell"]
    enabled_by_default: true
    risk_level: high
    policy_ref: .aiwg/mcp/policies.yaml#shell_execution

  sqlite:
    id: sqlite
    capability_class: structured_local_store
    command: uvx
    args: ["mcp-server-sqlite", "--db-path", "${DUMMIE_AIWG}/memory/dummie_sqlite.db"]
    enabled_by_default: true
    risk_level: low
    policy_ref: .aiwg/mcp/sqlite/policy.yaml
