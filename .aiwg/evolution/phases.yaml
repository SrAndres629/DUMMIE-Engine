phases:
  - id: "P1"
    name: "Mental Model Abstraction Layer + Session Operating Contract"
    block: "foundation"
    purpose: "Create the operating layer that allows DUMMIE to manage long-term objectives, short-term objectives, cognitive artifacts, context transformation, session contracts and evolution governance."
    depends_on: []
    status: "active"
    priority_now: 10
    priority_final: 10
    creates: [".aiwg/evolution", ".aiwg/mental_models", ".aiwg/session_contracts", ".aiwg/context_transform", "doc/specs/104-106"]
    modifies: []
    validates: ["reality_lock", "json_parse", "yaml_parse", "cold_read_operability", "spec_validation"]
    forbidden_actions: ["sudo", "git_push", "git_commit", "git_reset", "git_clean", "kuzu_real_writes", "parallel_runtime"]
    snowball_metrics: ["engine_native_reuse_delta", "context_quality_delta", "restart_verified", "hot_path_verified"]
    restart_validation: "cold-read simulation must load P1/P2 state without chat memory"
    hot_path_validation: "agent must identify P2 and forbidden skips from canonical files"
    decision_gate: "Phase 1 may pass only when canonical files parse and cold-read operability passes."
    next_phase: "P2"
  - id: "P2"
    name: "Baseline Reset & Reality Lock"
    block: "foundation"
    purpose: "Create a clean operational baseline before lifecycle audit or new runtime implementation."
    depends_on: ["P1"]
    status: "planned"
    priority_now: 9
    priority_final: 10
    creates: [".aiwg/reports/plan_v1_phase_2_baseline_reality_lock.md", ".aiwg/reports/plan_v1_phase_2_baseline_reality_lock.json"]
    modifies: []
    validates: ["git_status", "spec_validation", "test_status", "baseline_metrics"]
    forbidden_actions: ["new_runtime_modules", "swarm_agents", "obsidian_adapter", "autonomy_permissions", "large_dashboard"]
    snowball_metrics: ["baseline_completeness", "known_risk_visibility"]
    restart_validation: "baseline report discoverable after cold read"
    hot_path_validation: "P2 outputs and forbidden creations are discoverable"
    decision_gate: "baseline captured without introducing new runtime"
    next_phase: "P3"
  - id: "P3"
    name: "Artifact Lifecycle Reconciliation Audit"
